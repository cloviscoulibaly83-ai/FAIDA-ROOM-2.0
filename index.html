<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JN Design — Création Graphique & Digitale</title>
  <meta name="description" content="JN Design — Affiches, flyers, logos, visuels réseaux sociaux et créations graphiques professionnelles.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    :root {
      --black: #080808;
      --black2: #111111;
      --yellow: #ffbf00;
      --orange: #ff7a00;
      --white: #ffffff;
      --gray: #b7b7b7;
      --card: #151515;
      --green: #25d366;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVBAR */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(8,8,8,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,191,0,.15);
    }

    nav {
      max-width: 1150px;
      margin: auto;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--yellow);
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      color: #ddd;
      transition: .3s;
    }

    .nav-links a:hover {
      color: var(--yellow);
    }

    .menu {
      display: none;
      font-size: 27px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 20px 70px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,191,0,.12), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255,122,0,.10), transparent 30%),
        var(--black);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border: 1px solid rgba(255,191,0,.12);
      border-radius: 50%;
      top: -200px;
      right: -180px;
    }

    .hero-content {
      max-width: 850px;
      position: relative;
      z-index: 2;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid rgba(255,191,0,.5);
      border-radius: 30px;
      color: var(--yellow);
      font-size: 13px;
      margin-bottom: 25px;
      background: rgba(255,191,0,.06);
    }

    .hero h1 {
      font-size: clamp(55px, 12vw, 125px);
      line-height: .9;
      font-weight: 1000;
      letter-spacing: -6px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--yellow);
      text-shadow: 0 0 35px rgba(255,191,0,.18);
    }

    .hero h2 {
      font-size: clamp(22px, 4vw, 40px);
      margin-bottom: 15px;
    }

    .hero p {
      color: var(--gray);
      max-width: 650px;
      margin: auto;
      font-size: 17px;
    }

    .buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 25px;
      border-radius: 9px;
      font-weight: 800;
      transition: .3s;
      display: inline-block;
    }

    .btn-primary {
      background: var(--yellow);
      color: #000;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255,191,0,.2);
    }

    .btn-outline {
      border: 1px solid #444;
      color: white;
    }

    .btn-outline:hover {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    /* GENERAL */

    section {
      padding: 90px 20px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title small {
      color: var(--yellow);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .section-title h2 {
      font-size: clamp(30px, 5vw, 50px);
      margin-top: 8px;
    }

    .section-title p {
      color: var(--gray);
      max-width: 600px;
      margin: 10px auto;
    }

    /* SERVICES */

    .services {
      background: #0c0c0c;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .service-card {
      background: var(--card);
      border: 1px solid #242424;
      border-radius: 15px;
      padding: 30px;
      transition: .3s;
    }

    .service-card:hover {
      transform: translateY(-7px);
      border-color: rgba(255,191,0,.5);
    }

    .icon {
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: rgba(255,191,0,.1);
      color: var(--yellow);
      font-size: 27px;
      margin-bottom: 20px;
    }

    .service-card h3 {
      margin-bottom: 9px;
    }

    .service-card p {
      color: var(--gray);
      font-size: 14px;
    }

    /* PORTFOLIO */

    .portfolio {
      background: var(--black);
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .work {
      min-height: 310px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(145deg, #272727, #0c0c0c);
      border: 1px solid #292929;
      display: flex;
      align-items: flex-end;
      transition: .3s;
    }

    .work
